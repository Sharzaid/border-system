{% extends "base.html" %}
{% block title %}تسجيل الدخول – نظام المنفذ{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h1 style="text-align:center; margin-bottom: 0.25rem;">🛂 نظام المنفذ</h1>
        <p style="text-align:center; color:#718096; margin-bottom: 1.5rem; font-size:0.9rem;">
            الجوازات · الجمارك · سلاح الحدود
        </p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" required autofocus placeholder="أدخل اسم المستخدم" autocomplete="username">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" required placeholder="أدخل كلمة المرور" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">دخول</button>
        </form>
    </div>
    <p style="text-align:center; color:#a0aec0; font-size:0.8rem; margin-top:1rem;">
        الجلسة تنتهي تلقائياً بعد 12 ساعة
    </p>
</div>
{% endblock %}
